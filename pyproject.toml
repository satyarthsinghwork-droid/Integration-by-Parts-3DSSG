[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-by-parts-3dssg"
version = "0.1.0"
description = "Two-stage part-aware multimodal learning for official 3DSSG"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.4.6",
  "opencv-python-headless==4.11.0.86",
  "Pillow==11.3.0",
  "torch==2.6.0",
  "tqdm==4.67.3",
  "transformers==5.12.1",
]

[tool.setuptools]
packages = ["mtp_pipeline"]
